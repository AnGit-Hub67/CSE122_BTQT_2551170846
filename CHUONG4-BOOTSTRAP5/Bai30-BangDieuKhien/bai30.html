<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai30</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 230px;
            min-height: 100vh;
            background-color: #212529;
        }
        .progress-thin {
            height: 4px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">

        <div class="sidebar p-3 text-white flex-shrink-0">

            <h5 class="fw-bold py-2 mb-3 border-bottom border-secondary fs-6">CSE.TLU Admin</h5>
            
            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li class="nav-item">
                    <a href="#" class="nav-link active fw-medium py-2 px-3 rounded-2" aria-current="page">Bảng điều khiển</a>
                </li>
                <li>
                    <a href="#" class="nav-link text-secondary fw-medium py-2 px-3">Bài tập</a>
                </li>
                <li>
                    <a href="#" class="nav-link text-secondary fw-medium py-2 px-3">Sinh viên</a>
                </li>
                <li>
                    <a href="#" class="nav-link text-secondary fw-medium py-2 px-3">Điểm số</a>
                </li>
            </ul>
        </div>

        <div class="flex-grow-1 p-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-dark m-0">Bảng điều khiển</h3>
                <div class="d-flex gap-2">
                    <span class="badge bg-warning text-dark d-flex align-items-center px-3 py-2 rounded-2 fs-7">3 bài mới</span>
                    <button class="btn btn-primary px-3 py-2 fw-medium fs-7">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3 h-100">
                        <span class="text-muted fs-7 mb-1">Sinh viên</span>
                        <h2 class="fw-bold mb-3">128</h2>
                        <div class="progress progress-thin bg-light">
                            <div class="progress-bar bg-primary" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>


                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3 h-100">
                        <span class="text-muted fs-7 mb-1">Đã nộp</span>
                        <h2 class="fw-bold mb-3">96</h2>
                        <div class="progress progress-thin bg-light">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 60%" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>


                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3 h-100">
                        <span class="text-muted fs-7 mb-1">Chưa nộp</span>
                        <h2 class="fw-bold mb-3">32</h2>
                        <div class="progress progress-thin bg-light">
                            <div class="progress-bar bg-danger" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>


                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm rounded-3 p-3 h-100">
                        <span class="text-muted fs-7 mb-1">Điểm TB</span>
                        <h2 class="fw-bold mb-3">7.8</h2>
                        <div class="progress progress-thin bg-light">
                            <div class="progress-bar bg-warning" role="progressbar" style="width: 78%" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h6 class="fw-bold m-0 text-dark">Tiến độ theo chương</h6>
                </div>
                <ul class="list-group list-group-flush">

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
                        <span class="fw-normal text-dark">Chương 1 — HTML5</span>
                        <span class="badge bg-success px-2 py-1 fs-7">100%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
                        <span class="fw-normal text-dark">Chương 2 — JavaScript</span>
                        <span class="badge bg-info text-white px-2 py-1 fs-7">82%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
                        <span class="fw-normal text-dark">Chương 3 — CSS3</span>
                        <span class="badge bg-info text-white px-2 py-1 fs-7">74%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
                        <span class="fw-normal text-dark">Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary px-2 py-1 fs-7">45%</span>
                    </li>
                </ul>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
